name: Update README screenshot
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/capture-readme.mjs'
      - '.github/workflows/capture-screenshot.yml'
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install screenshot browser
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Capture real running PWA
        run: |
          python3 -m http.server 4173 --directory dist >/tmp/dqr-screen-server.log 2>&1 &
          node scripts/capture-readme.mjs
      - name: Commit refreshed screenshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/generate.png
          if ! git diff --cached --quiet; then
            git commit -m "Refresh README screenshot from current running DOUBLE QR"
            git push
          fi
