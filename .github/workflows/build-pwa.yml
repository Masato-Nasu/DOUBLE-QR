name: Build DOUBLE QR PWA
on:
  push:
    branches: [main]
    paths-ignore:
      - "dist/**"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Commit built app files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/app.js dist/sw.js
          if ! git diff --cached --quiet; then
            git commit -m "Build updated DOUBLE QR PWA"
            git push
          fi
