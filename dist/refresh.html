<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f6f3">
<meta http-equiv="Cache-Control" content="no-store">
<title>DOUBLE QR — 更新</title>
<style>
:root{color-scheme:light;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#171a19;background:#f6f6f3}
*{box-sizing:border-box}body{margin:0;padding:28px 22px}main{max-width:420px;margin:5vh auto}
h1{font-size:24px;letter-spacing:-.025em;margin:0 0 20px}p{font-size:15px;line-height:1.8;margin:14px 0}
button{display:block;width:100%;font:inherit;font-weight:600;border:0;border-radius:9px;min-height:52px;padding:12px 16px;background:#202820;color:white;margin-top:24px;cursor:pointer}
button:disabled{opacity:.65}a{color:#283a29;display:inline-block;margin-top:20px}
.note{font-size:13px;color:#586056}.status{margin-top:20px;white-space:pre-line}
</style>
</head>
<body><main>
<h1>DOUBLE QRを更新</h1>
<p>古い画面が残る場合に、DOUBLE QR専用のオフラインキャッシュを更新できます。</p>
<p class="note">現在入力中の文章と鍵は、更新後に消えます。必要なら先にコピーしてください。ほかのサイトのデータは消しません。インターネット接続が必要です。</p>
<button id="refresh" type="button">最新版を開く</button>
<p id="status" class="status" role="status" aria-live="polite"></p>
<a href="./">更新せずに戻る</a>
</main>
<script>
const button=document.getElementById('refresh');
const status=document.getElementById('status');
button.addEventListener('click',async()=>{
  button.disabled=true;
  status.textContent='DOUBLE QRの古いキャッシュを更新しています…';
  try{
    if('serviceWorker' in navigator){
      const base=new URL('./',location.href).href;
      const regs=await navigator.serviceWorker.getRegistrations();
      for(const reg of regs){
        if(reg.scope===base)await reg.unregister();
      }
    }
    if('caches' in window){
      for(const key of await caches.keys()){
        if(key.startsWith('double-qr-pwa-'))await caches.delete(key);
      }
    }
    status.textContent='完了しました。最新版を開きます…';
    location.replace('./?refresh='+Date.now());
  }catch(error){
    button.disabled=false;
    status.textContent='自動更新できませんでした。ブラウザでページを再読み込みして、もう一度お試しください。';
  }
});
</script>
</body>
</html>
